<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Tcho Burguer — Parear impressão</title>
<style>
  :root{ --bg:#16130f; --panel:#1f1b16; --line:#2f2921; --cream:#f2ede6; --muted:#a29585; --orange:#f39c12; --red:#e74c3c; --green:#2ecc71; }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--cream);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
    display:flex;align-items:center;justify-content:center;height:100vh;padding:1.2rem}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:1.6rem;width:100%;max-width:340px;text-align:center}
  h1{font-size:1.15rem;margin:0 0 .3rem}
  .sub{color:var(--muted);font-size:.8rem;margin:0 0 1.2rem;line-height:1.5}
  .sub b{color:var(--cream)}
  input{width:100%;box-sizing:border-box;padding:.7rem;margin-bottom:.6rem;border-radius:8px;
    border:1px solid var(--line);background:#100d0a;color:var(--cream);font-size:1rem;text-align:center}
  #codigo{letter-spacing:.4em;font-size:1.3rem;font-family:'Consolas',monospace}
  #nome{text-align:left;letter-spacing:normal;font-size:.85rem}
  button{width:100%;padding:.75rem;border:none;border-radius:8px;background:var(--orange);color:#1a1206;
    font-weight:700;font-size:.95rem;cursor:pointer;margin-top:.3rem}
  button:disabled{opacity:.5;cursor:default}
  .msg{font-size:.78rem;margin-top:.8rem;min-height:1.1rem;line-height:1.4}
  .msg.err{color:var(--red)}
  .msg.ok{color:var(--green)}
  .linha-diag{display:flex;gap:.5rem;justify-content:center;align-items:center;margin-top:.9rem;color:var(--muted);font-size:.72rem}
  .link{width:auto;margin:0;padding:0;background:none;color:var(--muted);font-weight:600;font-size:.72rem;text-decoration:underline;cursor:pointer}
  .link:hover{color:var(--cream)}
</style>
</head>
<body>
  <div class="card">
    <h1>🖨️ Parear este computador</h1>
    <p class="sub">No painel, abra <b>Configurações → App de impressão</b> e clique em
      <b>"Gerar código de pareamento"</b>. Digite aqui o código de 6 dígitos que aparecer.</p>
    <input id="codigo" maxlength="6" placeholder="000000" inputmode="numeric" autofocus>
    <input id="nome" placeholder="Nome deste PC (ex.: Caixa 1)">
    <button id="btn">Parear</button>
    <div class="msg" id="msg"></div>
    <div class="linha-diag">
      <button id="btn-teste" class="link">Testar conexão</button>
      <span>·</span>
      <button id="btn-log" class="link">Ver log de erros</button>
    </div>
  </div>
  <script src="pareamento.js"></script>
</body>
</html>
